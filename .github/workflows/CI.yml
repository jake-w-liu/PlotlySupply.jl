name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# Least privilege: jobs get read-only repository access unless they ask for more.
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # The suite opens real (hidden) Electron windows and exports images; the
    # hosted runners are slower than a workstation, so leave generous headroom.
    timeout-minutes: 120
    permissions:
      actions: write # julia-actions/cache deletes the old caches it created
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12' # minimum supported version (Project.toml compat)
          - '1' # latest stable release
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          # Native binaries for the runner (aarch64 on macos-latest); setup-julia v3
          # refuses x86_64 on Apple Silicon unless forced.
          arch: default
      - name: Install xvfb (headless Linux display for Electron)
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # The tests open real Electron windows. Linux runners have no display, so
          # run Julia (and the Electron processes it starts) inside a virtual X server.
          # PlotlySupply disables Electron's SUID sandbox when CI/GITHUB_ACTIONS is set.
          prefix: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum --server-args=-screen\ 0\ 1920x1080x24' || '' }}
      - uses: julia-actions/julia-processcoverage@v1
      - name: Show coverage info
        if: runner.os == 'Linux' && matrix.version == '1'
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.add([PackageSpec(name = "LocalCoverage"), PackageSpec(name = "CoverageTools")])
          import CoverageTools
          import LocalCoverage
          coverage = CoverageTools.LCOV.readfile("lcov.info")
          report = LocalCoverage.eval_coverage_metrics(coverage, ".")
          show(report)
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
