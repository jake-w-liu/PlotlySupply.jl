name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: read
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only: CompatHelper must push its branch and
    # open the pull request.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Add the General registry via Git
        shell: julia --color=yes {0}
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
      - name: Install CompatHelper
        shell: julia --color=yes {0}
        run: |
          import Pkg
          Pkg.add(; name = "CompatHelper", uuid = "aa819f21-2bde-4658-8897-bab36330d9b7", version = "3")
      - name: Run CompatHelper
        shell: julia --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Documenter SSH deploy key lets CompatHelper's pull requests trigger CI.
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          import CompatHelper
          CompatHelper.main()
